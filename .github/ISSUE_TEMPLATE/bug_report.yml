name: Bug report
description: Something in DAWDeck (Cubase, Nuendo or REAPER) does not work as described.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [troubleshooting guide](https://github.com/Wuestenrolph/DAWDeck-Support/blob/main/docs/TROUBLESHOOTING.md) first.
        **This issue is public** — don't include personal data, private project names or contact details.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: ["DAWDeck for Cubase & Nuendo", "DAWDeck for REAPER"]
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Stream Deck app → Preferences → Plugins → DAWDeck
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: daw-version
    attributes:
      label: DAW and version
      options: ["Cubase Pro 15", "Cubase Pro 14", "Cubase Pro 13", "Cubase Pro 12", "Nuendo 15", "Nuendo 14", "Nuendo 13", "Nuendo 12", "REAPER 7", "Other (please specify below)"]
    validations:
      required: true
  - type: input
    id: cubase-build
    attributes:
      label: Exact DAW build
      description: "Cubase/Nuendo: Help → About. REAPER: Help → About REAPER."
      placeholder: "15.0.20"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Windows 11", "Windows 10", "macOS (Apple Silicon)", "macOS (Intel)"]
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Stream Deck model
      options: ["Stream Deck XL", "Stream Deck MK.2 / Classic", "Stream Deck Neo", "Stream Deck +", "Stream Deck Mini", "Other"]
    validations:
      required: true
  - type: input
    id: sd-version
    attributes:
      label: Stream Deck app version
      placeholder: "7.6.1"
  - type: dropdown
    id: setup-status
    attributes:
      label: Setup Assistant status
      description: Click any DAWDeck key in the Stream Deck app and look at the indicators at the top.
      options: ["All green", "Cubase/Nuendo: MIDI In red", "Cubase/Nuendo: MIDI Out red", "Cubase/Nuendo: script not green", "REAPER: OSC pattern not green", "REAPER: OSC connection red", "Several red"]
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Already tried
      options:
        - label: "Windows only: restarted loopMIDI completely after creating the ports"
        - label: "Cubase/Nuendo only: unticked In 'All MIDI Inputs' for Cubase-To-SDXL"
        - label: "Cubase/Nuendo only: reloaded scripts (MIDI Remote Manager → ↻)"
        - label: "Clicked Refresh / Resync in the Setup Assistant"
        - label: "REAPER only: OSC surface uses pattern DAWDeck, device port 9000, listen port 8000"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select a track in the DAW
        2. Press the Rec Arm key
        3. ...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A screenshot of the Setup Assistant (and of Cubase's MIDI Remote Manager or REAPER's OSC settings) helps a lot.
